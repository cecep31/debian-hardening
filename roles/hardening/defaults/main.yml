---
# When false, only config files are written: nothing is started, reloaded or loaded.
# Defaults to true only when systemd is running (false in a test container).
hardening_runtime_apply: "{{ hardening_systemd_running | default(false) }}"

# ---------------------------------------------------------------- Platform
# auto | aws | gcp | generic. "auto" detects AWS EC2 and Google Compute Engine from
# DMI facts. On aws/gcp the role uses the provider's time source and keeps IPv6
# router advertisements on (the IPv6 default route comes from them).
hardening_platform: auto

# Time servers for systemd-timesyncd per platform. Empty keeps Debian's defaults.
hardening_ntp_servers_by_platform:
  aws: ["169.254.169.123"]          # Amazon Time Sync Service (link-local, every region)
  gcp: ["metadata.google.internal"]  # Google internal NTP via the metadata server
  # Same pool as Debian's default, written explicitly so CIS sees a configured source.
  generic: ["0.debian.pool.ntp.org", "1.debian.pool.ntp.org", "2.debian.pool.ntp.org", "3.debian.pool.ntp.org"]
# Always written as FallbackNTP so the Debian pool stays available behind a provider source.
hardening_ntp_fallback_servers: ["0.debian.pool.ntp.org", "1.debian.pool.ntp.org", "2.debian.pool.ntp.org", "3.debian.pool.ntp.org"]
hardening_ntp_servers: "{{ hardening_ntp_servers_by_platform[hardening_platform_effective] | default([]) }}"

# ---------------------------------------------------------------- SSH
hardening_ssh_port: 22
hardening_ssh_permit_root_login: false
hardening_ssh_password_authentication: false
# Who may log in over SSH. With both lists empty and hardening_ssh_restrict_access on, only
# the user Ansible connects as is allowed (CIS wants an explicit allow list). Add everyone
# else who must log in here; on GCP with OS Login, list those users or use a group.
hardening_ssh_allow_users: []
hardening_ssh_allow_groups: []
hardening_ssh_restrict_access: true
# Values below follow CIS Debian 13 Level 1.
hardening_ssh_max_auth_tries: 4
hardening_ssh_max_sessions: 10
hardening_ssh_max_startups: "10:30:60"
hardening_ssh_login_grace_time: 60
hardening_ssh_client_alive_interval: 300
hardening_ssh_client_alive_count_max: 3
hardening_ssh_log_level: INFO
hardening_ssh_x11_forwarding: false
hardening_ssh_allow_tcp_forwarding: false
hardening_ssh_allow_agent_forwarding: false
hardening_ssh_ciphers:
  - chacha20-poly1305@openssh.com
  - aes256-gcm@openssh.com
  - aes128-gcm@openssh.com
  - aes256-ctr
  - aes192-ctr
  - aes128-ctr
hardening_ssh_kex:
  - mlkem768x25519-sha256
  - sntrup761x25519-sha512@openssh.com
  - curve25519-sha256
  - curve25519-sha256@libssh.org
  - ecdh-sha2-nistp256
  - ecdh-sha2-nistp384
  - ecdh-sha2-nistp521
  - diffie-hellman-group-exchange-sha256
  - diffie-hellman-group16-sha512
  - diffie-hellman-group18-sha512
  - diffie-hellman-group14-sha256
hardening_ssh_macs:
  - hmac-sha2-512-etm@openssh.com
  - hmac-sha2-256-etm@openssh.com
  - hmac-sha2-512
  - hmac-sha2-256
# Directives this role owns. The same directives in /etc/ssh/sshd_config and other
# drop-ins (cloud images often set PermitRootLogin, X11Forwarding there) are commented
# out so there is a single source of truth and compliance scanners see no conflict.
hardening_ssh_managed_directives:
  - Port
  - PermitRootLogin
  - PasswordAuthentication
  - KbdInteractiveAuthentication
  - PermitEmptyPasswords
  - PubkeyAuthentication
  - AllowUsers
  - AllowGroups
  - MaxAuthTries
  - MaxSessions
  - MaxStartups
  - LoginGraceTime
  - ClientAliveInterval
  - ClientAliveCountMax
  - X11Forwarding
  - AllowTcpForwarding
  - AllowAgentForwarding
  - PermitUserEnvironment
  - IgnoreRhosts
  - HostbasedAuthentication
  - LogLevel
  - Banner
  - Ciphers
  - KexAlgorithms
  - MACs

# Login banner for /etc/issue, /etc/issue.net (shown by SSH) and /etc/motd.
hardening_banner_text: "Authorized users only. All activity may be monitored and reported."

# ---------------------------------------------------------------- Firewall (nftables)
hardening_firewall_enabled: true
hardening_firewall_allowed_tcp_ports: []
hardening_firewall_allowed_udp_ports: []
hardening_firewall_allow_icmp: true
# New SSH connections allowed per source IP (nftables limit syntax).
hardening_firewall_ssh_rate_limit: "15/minute burst 5 packets"

# ---------------------------------------------------------------- Automatic updates
hardening_auto_updates_enabled: true
hardening_auto_reboot: false
hardening_auto_reboot_time: "03:30"

# ---------------------------------------------------------------- fail2ban
hardening_fail2ban_enabled: true
hardening_fail2ban_maxretry: 5
hardening_fail2ban_findtime: 10m
hardening_fail2ban_bantime: 1h

# ---------------------------------------------------------------- Logging
# journald keeps the logs; rsyslog is installed as well (CIS) and receives them from journald,
# writing the classic /var/log/syslog, auth.log and so on. It does not listen on the network.
hardening_rsyslog_enabled: true

# ---------------------------------------------------------------- auditd
hardening_auditd_enabled: true
# Watched for login activity when they exist (Debian 13 uses wtmpdb and lastlog2).
hardening_auditd_login_paths:
  - /var/lib/wtmpdb
  - /var/lib/lastlog
  - /var/log/wtmp
  - /var/log/btmp
  - /var/log/lastlog

# ---------------------------------------------------------------- Kernel
hardening_sysctl:
  # Network
  net.ipv4.conf.all.accept_redirects: 0
  net.ipv4.conf.default.accept_redirects: 0
  net.ipv6.conf.all.accept_redirects: 0
  net.ipv6.conf.default.accept_redirects: 0
  net.ipv4.conf.all.secure_redirects: 0
  net.ipv4.conf.default.secure_redirects: 0
  net.ipv4.conf.all.send_redirects: 0
  net.ipv4.conf.default.send_redirects: 0
  net.ipv4.conf.all.accept_source_route: 0
  net.ipv4.conf.default.accept_source_route: 0
  net.ipv6.conf.all.accept_source_route: 0
  net.ipv6.conf.default.accept_source_route: 0
  net.ipv4.conf.all.rp_filter: 1
  net.ipv4.conf.default.rp_filter: 1
  net.ipv4.conf.all.log_martians: 1
  net.ipv4.conf.default.log_martians: 1
  net.ipv4.icmp_echo_ignore_broadcasts: 1
  net.ipv4.icmp_ignore_bogus_error_responses: 1
  net.ipv4.tcp_syncookies: 1
  # Kernel
  kernel.kptr_restrict: 1
  kernel.dmesg_restrict: 1
  kernel.yama.ptrace_scope: 1
  kernel.randomize_va_space: 2
  kernel.unprivileged_bpf_disabled: 1
  net.core.bpf_jit_harden: 2
  fs.protected_hardlinks: 1
  fs.protected_symlinks: 1
  fs.protected_fifos: 2
  fs.protected_regular: 2
  fs.suid_dumpable: 0
  # Routing (set hardening_ip_forwarding: true on routers, NAT and Docker hosts)
  net.ipv4.ip_forward: "{{ 1 if hardening_ip_forwarding | bool else 0 }}"
  net.ipv4.conf.all.forwarding: "{{ 1 if hardening_ip_forwarding | bool else 0 }}"
  net.ipv4.conf.default.forwarding: "{{ 1 if hardening_ip_forwarding | bool else 0 }}"
  net.ipv6.conf.all.forwarding: "{{ 1 if hardening_ip_forwarding | bool else 0 }}"
  net.ipv6.conf.default.forwarding: "{{ 1 if hardening_ip_forwarding | bool else 0 }}"

hardening_ip_forwarding: false

# IPv6 router advertisements. AWS and GCP deliver the IPv6 default route through
# them, so they stay on there; elsewhere they are ignored (CIS).
hardening_ipv6_accept_ra: "{{ hardening_platform_effective in ['aws', 'gcp'] }}"

# Rarely used filesystems, network protocols and removable storage that should not load.
hardening_disabled_kernel_modules:
  - cramfs
  - freevxfs
  - hfs
  - hfsplus
  - jffs2
  - udf
  - dccp
  - sctp
  - rds
  - tipc
  - usb-storage
  - firewire-core
  - atm
  - can

# ---------------------------------------------------------------- Packages
hardening_packages_remove:
  - telnet
  - rsh-client
  - talk
  - nis

# ---------------------------------------------------------------- Accounts
hardening_umask: "027"  # login.defs, /etc/profile.d and /etc/bash.bashrc
# Only members of this group may use `su` (pam_wheel). The group is created empty,
# so `su` is blocked for everyone until you add members; sudo is unaffected.
# Set to "" to leave `su` unrestricted.
hardening_su_group: sugroup

# Lock accounts this many days after their password expires (useradd INACTIVE).
hardening_account_inactive_days: 45
# Log out idle interactive shells after this many seconds (TMOUT). 0 disables.
hardening_shell_timeout: 900
# Minutes before sudo asks for the password again.
hardening_sudo_timestamp_timeout: 15

# ---------------------------------------------------------------- Password policy (PAM)
hardening_pwquality:
  minlen: 14
  minclass: 4
  dcredit: -1
  ucredit: -1
  lcredit: -1
  ocredit: -1
  maxrepeat: 3
  maxsequence: 3
  difok: 2
  dictcheck: 1
  enforcing: 1
hardening_pwhistory_remember: 24

# ---------------------------------------------------------------- Strict controls (on by default)
# CIS controls that can disrupt some workloads. They are on so the scan passes; turn one
# off here if it gets in the way (the scan then reports that rule as failed).
#
# Lock an account after failed password attempts (pam_faillock).
hardening_faillock_enabled: true
hardening_faillock_deny: 4
hardening_faillock_unlock_time: 900
# Mount /tmp with noexec. Breaks installers and tools that run scripts from /tmp.
hardening_tmp_noexec: true
# AIDE file integrity checking: builds a database (minutes, I/O heavy) and checks daily.
hardening_aide_enabled: true
hardening_pass_max_days: 365
hardening_pass_min_days: 1
hardening_pass_warn_age: 7
