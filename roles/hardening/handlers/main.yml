---
- name: Reload ssh
  ansible.builtin.systemd_service:
    name: ssh
    state: reloaded
  when: hardening_runtime_apply | bool

- name: Reload nftables
  ansible.builtin.systemd_service:
    name: nftables
    state: restarted
  when: hardening_runtime_apply | bool

- name: Apply sysctl
  ansible.builtin.command: sysctl --system
  changed_when: true
  when: hardening_runtime_apply | bool

- name: Restart fail2ban
  ansible.builtin.systemd_service:
    name: fail2ban
    state: restarted
  when: hardening_runtime_apply | bool

- name: Load audit rules
  ansible.builtin.command: augenrules --load
  changed_when: true
  when: hardening_runtime_apply | bool

- name: Reload systemd
  ansible.builtin.systemd_service:
    daemon_reload: true
  when: hardening_runtime_apply | bool
