---
- name: Reload ssh
  ansible.builtin.systemd_service:
    name: ssh
    state: reloaded
  when: hardening_runtime_apply | bool
  # --check does not really install packages, so their services may not exist yet.
  ignore_errors: "{{ ansible_check_mode }}"

- name: Reload nftables
  ansible.builtin.systemd_service:
    name: nftables
    # Reload re-reads /etc/nftables.conf; restart would flush every table, including fail2ban's.
    state: reloaded
  when: hardening_runtime_apply | bool
  # --check does not really install packages, so their services may not exist yet.
  ignore_errors: "{{ ansible_check_mode }}"

- name: Apply sysctl
  ansible.builtin.command: sysctl --system
  changed_when: true
  when: hardening_runtime_apply | bool

- name: Restart fail2ban
  ansible.builtin.systemd_service:
    name: fail2ban
    state: restarted
  when: hardening_runtime_apply | bool
  # --check does not really install packages, so their services may not exist yet.
  ignore_errors: "{{ ansible_check_mode }}"

- name: Load audit rules
  ansible.builtin.command: augenrules --load
  changed_when: true
  when: hardening_runtime_apply | bool

- name: Reload systemd
  ansible.builtin.systemd_service:
    daemon_reload: true
  when: hardening_runtime_apply | bool
  # --check does not really install packages, so their services may not exist yet.
  ignore_errors: "{{ ansible_check_mode }}"

- name: Restart timesyncd
  ansible.builtin.systemd_service:
    name: systemd-timesyncd
    state: restarted
  when: hardening_runtime_apply | bool
  # --check does not really install packages, so their services may not exist yet.
  ignore_errors: "{{ ansible_check_mode }}"

- name: Update PAM
  ansible.builtin.command: pam-auth-update --package
  environment:
    DEBIAN_FRONTEND: noninteractive
  changed_when: true

- name: Restart journald
  ansible.builtin.systemd_service:
    name: systemd-journald
    state: restarted
  when: hardening_runtime_apply | bool
  # --check does not really install packages, so their services may not exist yet.
  ignore_errors: "{{ ansible_check_mode }}"
