---
# Opt-in (hardening_aide_enabled). Building the first database reads the whole
# filesystem and can take several minutes.
- name: Install AIDE
  ansible.builtin.apt:
    name: [aide, aide-common]
    state: present

- name: Build the AIDE database
  ansible.builtin.command:
    cmd: aideinit --yes --force
    creates: /var/lib/aide/aide.db

# CIS checks for these two units. They replace Debian's dailyaidecheck timer, which is
# switched off below so the check does not run twice a day.
- name: Write the AIDE check service
  ansible.builtin.copy:
    dest: /etc/systemd/system/aidecheck.service
    content: |
      [Unit]
      Description=Aide Check

      [Service]
      Type=simple
      ExecStart=/usr/sbin/aide --check

      [Install]
      WantedBy=multi-user.target
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd

- name: Write the AIDE check timer
  ansible.builtin.copy:
    dest: /etc/systemd/system/aidecheck.timer
    content: |
      [Unit]
      Description=Aide check every day at 5AM

      [Timer]
      OnCalendar=*-*-* 05:00:00
      Unit=aidecheck.service

      [Install]
      WantedBy=multi-user.target
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd

- name: Enable the daily AIDE check
  ansible.builtin.systemd_service:
    name: aidecheck.timer
    enabled: true
    state: started
    daemon_reload: true
  when: hardening_runtime_apply | bool
  # --check does not really install packages, so their services may not exist yet.
  ignore_errors: "{{ ansible_check_mode }}"

# CIS wants the service enabled as well as the timer. Enabling does not start it now;
# it also runs the check at boot.
- name: Enable the AIDE check service
  ansible.builtin.systemd_service:
    name: aidecheck.service
    enabled: true
  when: hardening_runtime_apply | bool
  ignore_errors: "{{ ansible_check_mode }}"

- name: Switch off Debian's own daily AIDE timer
  ansible.builtin.systemd_service:
    name: dailyaidecheck.timer
    enabled: false
    state: stopped
  when: hardening_runtime_apply | bool
  ignore_errors: "{{ ansible_check_mode }}"
