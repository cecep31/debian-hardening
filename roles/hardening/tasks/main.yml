---
- name: Preflight checks
  ansible.builtin.import_tasks: preflight.yml
  tags: [always]

- name: Packages
  ansible.builtin.import_tasks: packages.yml
  tags: [packages]

- name: SSH
  ansible.builtin.import_tasks: ssh.yml
  tags: [ssh]

- name: Firewall
  ansible.builtin.import_tasks: firewall.yml
  when: hardening_firewall_enabled | bool
  tags: [firewall]

- name: Automatic updates
  ansible.builtin.import_tasks: updates.yml
  when: hardening_auto_updates_enabled | bool
  tags: [updates]

- name: Kernel
  ansible.builtin.import_tasks: kernel.yml
  tags: [kernel]

- name: Fail2ban
  ansible.builtin.import_tasks: fail2ban.yml
  when: hardening_fail2ban_enabled | bool
  tags: [fail2ban]

- name: Auditd
  ansible.builtin.import_tasks: auditd.yml
  when: hardening_auditd_enabled | bool
  tags: [auditd]

- name: System settings
  ansible.builtin.import_tasks: system.yml
  tags: [system]
