---
- name: Preflight checks
  ansible.builtin.import_tasks: preflight.yml
  tags: [always]

- name: Packages
  ansible.builtin.import_tasks: packages.yml
  tags: [packages]

- name: SSH
  ansible.builtin.import_tasks: ssh.yml
  tags: [ssh]

- name: Firewall
  ansible.builtin.import_tasks: firewall.yml
  when: hardening_firewall_enabled | bool
  tags: [firewall]

- name: Automatic updates
  ansible.builtin.import_tasks: updates.yml
  when: hardening_auto_updates_enabled | bool
  tags: [updates]

- name: Kernel
  ansible.builtin.import_tasks: kernel.yml
  tags: [kernel]

- name: Fail2ban
  ansible.builtin.import_tasks: fail2ban.yml
  when: hardening_fail2ban_enabled | bool
  tags: [fail2ban]

- name: Auditd
  ansible.builtin.import_tasks: auditd.yml
  when: hardening_auditd_enabled | bool
  tags: [auditd]

- name: System settings
  ansible.builtin.import_tasks: system.yml
  tags: [system]

- name: Accounts, shells and banners
  ansible.builtin.import_tasks: accounts.yml
  tags: [accounts]

- name: Password policy (PAM)
  ansible.builtin.import_tasks: pam.yml
  tags: [pam]

- name: Cron
  ansible.builtin.import_tasks: cron.yml
  tags: [cron]

- name: Logging
  ansible.builtin.import_tasks: logging.yml
  tags: [logging]

- name: Mount options
  ansible.builtin.import_tasks: mounts.yml
  tags: [mounts]

- name: Boot loader
  ansible.builtin.import_tasks: boot.yml
  tags: [boot]

- name: File integrity (AIDE, opt-in)
  ansible.builtin.import_tasks: aide.yml
  when: hardening_aide_enabled | bool
  tags: [aide]

# Handlers (service restarts, package scripts) can touch files too; settle them first.
- name: Run pending handlers before the final permission fixes
  ansible.builtin.meta: flush_handlers
  tags: [always]

- name: File permissions
  ansible.builtin.import_tasks: permissions.yml
  tags: [system, permissions]
