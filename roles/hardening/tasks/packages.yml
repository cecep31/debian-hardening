---
- name: Install hardening packages
  ansible.builtin.apt:
    name:
      - openssh-server
      - nftables
      - unattended-upgrades
      - apt-listchanges
      - fail2ban
      - python3-systemd
      - auditd
      - apparmor
      - apparmor-utils
      - systemd-timesyncd
      - sudo
      - kmod
      - logrotate
      - systemd-journal-remote  # package only; its network receiver stays off (see logging.yml)
      - cron
      - libpam-pwquality  # enabled in /etc/pam.d/common-password by pam-auth-update
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Remove insecure legacy packages
  ansible.builtin.apt:
    name: "{{ hardening_packages_remove }}"
    state: absent
    purge: true

- name: Install rsyslog
  ansible.builtin.apt:
    name: rsyslog
    state: present
  when: hardening_rsyslog_enabled | bool
