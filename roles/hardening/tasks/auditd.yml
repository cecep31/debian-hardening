---
- name: Write audit rules
  ansible.builtin.template:
    src: audit.rules.j2
    dest: /etc/audit/rules.d/50-hardening.rules
    owner: root
    group: root
    mode: "0640"
  notify: Load audit rules

- name: Ensure auditd is enabled and running
  ansible.builtin.systemd_service:
    name: auditd
    enabled: true
    state: started
  when: hardening_runtime_apply | bool
