---
- name: Write sysctl settings
  ansible.builtin.template:
    src: sysctl.conf.j2
    dest: /etc/sysctl.d/60-hardening.conf
    owner: root
    group: root
    mode: "0644"
  notify: Apply sysctl

- name: Block rarely used kernel modules
  ansible.builtin.template:
    src: modprobe.conf.j2
    dest: /etc/modprobe.d/hardening.conf
    owner: root
    group: root
    mode: "0644"
